name: AIRIV Odoo App Store CI

on:
  push:
    branches:
      - "18.0"
  pull_request:
    branches:
      - "18.0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appstore-audit:
    name: Validate Odoo Apps Store package
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run AIRIV Apps Store audit
        run: python .github/scripts/validate_odoo_appstore.py
